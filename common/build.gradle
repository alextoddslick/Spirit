plugins {
    id "dev.architectury.loom"
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-common:${jei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version"
    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-common-$rootProject.resourcefullib_version"
}

architectury {
    common(rootProject.platforms.split(","))
}

loom {
    // The common module isn't a loadable mod — its run configs launch a vanilla client,
    // which made `gradlew runClient` open vanilla first and the modded client after.
    // Only :fabric:runClient should ever launch a game.
    runs.configureEach {
        ideConfigGenerated = false
    }
}

tasks.configureEach {
    if (name == "runClient" || name == "runServer") {
        enabled = false
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
